<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">

<title>Meow Live Dashboard Guide</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f172a;color:#e2e8f0;line-height:1.8}
.sidebar{position:fixed;top:0;right:0;width:300px;height:100vh;background:#1e293b;border-left:1px solid #334155;overflow-y:auto;z-index:100;padding:0;transition:transform .3s}
.sidebar .logo{text-align:center;padding:15px;border-bottom:1px solid #334155;position:sticky;top:0;background:#1e293b;z-index:1}
.sidebar .logo h2{color:#38bdf8;font-size:1.3em}
.sidebar .logo p{color:#94a3b8;font-size:.75em}
.menu-item{display:block;text-decoration:none;transition:all .2s;border-right:3px solid transparent}
.menu-parent{padding:10px 15px;color:#f1f5f9;font-weight:600;font-size:.88em;cursor:pointer;display:flex;align-items:center;gap:8px;background:#1e293b}
.menu-parent:hover{background:#334155}
.menu-parent.active{color:#38bdf8;border-right-color:#38bdf8;background:#334155}
.menu-parent .arrow{margin-right:auto;transition:transform .2s;font-size:.7em}
.menu-parent .arrow.open{transform:rotate(90deg)}
.menu-children{display:none;background:#0f172a}
.menu-children.open{display:block}
.menu-child{display:block;padding:8px 35px 8px 15px;color:#94a3b8;text-decoration:none;font-size:.82em;transition:all .2s;border-right:3px solid transparent}
.menu-child:hover{color:#38bdf8;background:#1a2332}
.menu-child.active{color:#38bdf8;border-right-color:#38bdf8}
.menu-sub-parent{padding:8px 35px 8px 15px;color:#cbd5e1;font-size:.82em;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s}
.menu-sub-parent:hover{color:#38bdf8;background:#1a2332}
.menu-sub-children{display:none;background:#0a1120}
.menu-sub-children.open{display:block}
.menu-sub-child{display:block;padding:6px 50px 6px 15px;color:#64748b;text-decoration:none;font-size:.78em;transition:all .2s}
.menu-sub-child:hover{color:#38bdf8}
.main{margin-right:300px;padding:25px}
.header-banner{background:linear-gradient(135deg,#0ea5e9,#8b5cf6);border-radius:16px;padding:35px;margin-bottom:25px;text-align:center}
.header-banner h1{color:#fff;font-size:2em;margin-bottom:8px}
.header-banner p{color:rgba(255,255,255,.85);font-size:1em}
.search-box{max-width:500px;margin:15px auto 0;position:relative}
.search-box input{width:100%;padding:10px 18px 10px 40px;border-radius:25px;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:.95em;outline:none}
.search-box input::placeholder{color:rgba(255,255,255,.6)}
.section{background:#1e293b;border-radius:12px;padding:25px;margin-bottom:20px;border:1px solid #334155;scroll-margin-top:20px}
.section h2{color:#38bdf8;font-size:1.4em;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.section .subtitle{color:#94a3b8;margin-bottom:15px;font-size:.9em}
.section p{color:#cbd5e1;margin-bottom:10px;font-size:.92em}
.sub-items{margin:10px 0}
.sub-item{background:#0f172a;border:1px solid #334155;border-radius:8px;padding:12px 15px;margin-bottom:8px}
.sub-item h4{color:#f1f5f9;font-size:.92em;margin-bottom:4px}
.sub-item p{color:#94a3b8;font-size:.82em;margin:0}
.sub-item .path{color:#64748b;font-size:.78em;font-family:monospace;direction:ltr;display:inline-block}
.media-zone{background:#0f172a;border:2px dashed #334155;border-radius:10px;padding:25px;text-align:center;margin:15px 0;cursor:pointer;transition:all .3s;position:relative;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.media-zone:hover{border-color:#38bdf8;background:#1a2332}
.media-zone .upload-icon{font-size:2.5em;color:#475569;margin-bottom:8px}
.media-zone .upload-text{color:#94a3b8;font-size:.9em}
.media-zone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin:12px 0}
.gallery-item{position:relative;border-radius:8px;overflow:hidden;border:1px solid #334155;background:#0f172a}
.gallery-item img,.gallery-item video{width:100%;height:180px;object-fit:cover}
.gallery-item .caption{padding:8px;color:#94a3b8;font-size:.8em}
.gallery-item .remove-gallery{position:absolute;top:6px;left:6px;background:rgba(239,68,68,.9);color:#fff;border:none;border-radius:50%;width:22px;height:22px;cursor:pointer;font-size:.8em}
textarea.note-input{width:100%;min-height:60px;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:10px;color:#e2e8f0;font-size:.85em;resize:vertical;margin:8px 0}
textarea.note-input:focus{outline:none;border-color:#38bdf8}
.note-box{background:#1a2332;border-right:4px solid #f59e0b;padding:12px 15px;border-radius:0 8px 8px 0;margin:12px 0}
.note-box p{color:#fbbf24;margin:0;font-size:.85em}
.toggle-btn{position:fixed;top:12px;right:12px;z-index:200;background:#1e293b;border:1px solid #334155;color:#38bdf8;width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:1.2em;display:none}
.dark-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}
.save-indicator{position:fixed;bottom:70px;left:15px;background:#22c55e;color:#fff;padding:6px 14px;border-radius:8px;font-size:.82em;opacity:0;transition:opacity .3s;z-index:200}
.save-indicator.show{opacity:1}
.print-btn{position:fixed;bottom:15px;left:15px;z-index:200;background:#0ea5e9;color:#fff;border:none;width:45px;height:45px;border-radius:50%;cursor:pointer;font-size:1.2em;box-shadow:0 4px 15px rgba(14,165,233,.4)}
.lang-switcher{position:fixed;top:12px;left:12px;z-index:200}
.lang-switcher select{background:#1e293b;color:#38bdf8;border:1px solid #334155;border-radius:8px;padding:8px 12px;font-size:.85em;cursor:pointer;outline:none}
.lang-switcher select:hover{border-color:#38bdf8}
@media(max-width:768px){
.sidebar{transform:translateX(100%)}
.sidebar.open{transform:translateX(0)}
.main{margin-right:0;padding:12px}
.toggle-btn{display:block}
.dark-overlay.show{display:block}
.header-banner{padding:20px 12px}
.header-banner h1{font-size:1.4em}
}
@media print{
.sidebar,.toggle-btn,.print-btn,.media-zone,.save-indicator{display:none!important}
.main{margin-right:0}
body{background:#fff;color:#333}
.section{border:1px solid #ddd;break-inside:avoid}
}
</style>
</head>

} else {
document.querySelector('.sidebar').style.right = '0';
document.querySelector('.sidebar').style.left = 'auto';
document.querySelector('.sidebar').style.borderRight = 'none';
document.querySelector('.sidebar').style.borderLeft = '1px solid #334155';
document.querySelector('.main').style.marginLeft = '0';
document.querySelector('.main').style.marginRight = '300px';
}
document.getElementById('saveIndicator').textContent = s.saved;
document.querySelector('#langSwitcher select').value = lang;
renderAll();
}

const STORAGE_KEY = 'meow_guide_v2';
function getStore(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){return {}}}
function setStore(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d));document.getElementById('saveIndicator').classList.add('show');setTimeout(()=>document.getElementById('saveIndicator').classList.remove('show'),1200)}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}

function renderAll(){
const nav=document.getElementById('sidebarNav');
const main=document.getElementById('mainContent');
let navH='',mainH='';

const s = UI_STRINGS[currentLang];
document.querySelector('.sidebar .logo h2').textContent = s.sideTitle;
document.querySelector('.sidebar .logo p').textContent = s.sideDesc;

mainH+=`<div class="header-banner"><h1>${s.title}</h1><p>${s.subtitle}</p><div class="search-box"><input type="text" placeholder="${s.search}" oninput="searchSections(this.value)"></div></div>`;
mainH+=`<div class="note-box"><p>${s.note}</p></div>`;

MENU_DATA.forEach(item=>{
const key='s'+item.id;
const hasChildren=item.children&&item.children.length>0;

// Sidebar
navH+=`<div class="menu-parent" onclick="scrollToSection('${key}')">${item.title}`;
if(hasChildren) navH+=`<span class="arrow" onclick="event.stopPropagation();toggleMenu(this)">◀</span>`;
navH+=`</div>`;
if(hasChildren){
navH+=`<div class="menu-children">`;
item.children.forEach(ch=>{
if(ch.subchildren||ch.subchildren2){
navH+=`<div class="menu-sub-parent" onclick="event.stopPropagation();toggleSubMenu(this)">${ch.title} <span class="arrow">◀</span></div>`;
navH+=`<div class="menu-sub-children">`;
const subs=ch.subchildren||ch.subchildren2||[];
subs.forEach(sc=>{
if(sc.subchildren2){
navH+=`<div class="menu-sub-parent" style="padding-right:50px" onclick="event.stopPropagation();toggleSubMenu(this)">${sc.title} <span class="arrow">◀</span></div>`;
navH+=`<div class="menu-sub-children">`;
sc.subchildren2.forEach(sc2=>{navH+=`<a class="menu-sub-child" href="#s${sc2.id}" onclick="event.preventDefault();scrollToSection('s${sc2.id}')">${sc2.title}</a>`});
navH+=`</div>`;
} else {
navH+=`<a class="menu-sub-child" href="#s${sc.id}" onclick="event.preventDefault();scrollToSection('s${sc.id}')">${sc.title}</a>`;
}
});
navH+=`</div>`;
} else {
navH+=`<a class="menu-child" href="#s${ch.id}" onclick="event.preventDefault();scrollToSection('s${ch.id}')">${ch.title}</a>`;
}
});
navH+=`</div>`;
}

// Main content
mainH+=`<div class="section" id="${key}">`;
mainH+=`<h2>${item.title}</h2>`;
mainH+=`<p>${item.desc}</p>`;

if(hasChildren){
mainH+=`<div class="sub-items">`;
item.children.forEach(ch=>{
mainH+=renderSubItem(ch);
const nested=ch.subchildren||ch.subchildren2||[];
nested.forEach(sc=>{
mainH+=renderSubItem(sc);
const nested2=sc.subchildren2||[];
nested2.forEach(sc2=>mainH+=renderSubItem(sc2));
});
});
mainH+=`</div>`;
}

mainH+=`<div class="media-zone"><div class="upload-icon">📸</div><div class="upload-text">${s.upload}</div><input type="file" accept="image/*,video/*" onchange="handleUpload(this,'${key}')"></div>`;
mainH+=`<div class="gallery" id="gal-${key}"></div>`;
mainH+=`<textarea class="note-input" placeholder="${s.notePlaceholder}" data-key="${key}" oninput="saveNote(this)"></textarea>`;
mainH+=`</div>`;
});

nav.innerHTML=navH;
main.innerHTML=mainH;
loadSaved();
}

function renderSubItem(item){
const s = UI_STRINGS[currentLang];
const subKey='s'+item.id;
let h=`<div class="sub-item" id="${subKey}"><h4>${item.title}</h4><p>${item.desc}</p>`;
if(item.uri&&item.uri!=='soon') h+=`<span class="path">/admin/${item.uri}</span>`;
h+=`<div class="media-zone" style="min-height:80px;padding:12px;margin:8px 0"><div class="upload-icon" style="font-size:1.5em">📸</div><div class="upload-text" style="font-size:.8em">${s.upload}</div><input type="file" accept="image/*,video/*" multiple onchange="handleUpload(this,'${subKey}')"></div>`;
h+=`<div class="gallery" id="gal-${subKey}"></div>`;
h+=`<textarea class="note-input" placeholder="${s.notePlaceholder}" data-key="${subKey}" oninput="saveNote(this)" style="min-height:40px;font-size:.8em"></textarea>`;
h+=`</div>`;
return h;
}

function scrollToSection(id){
const el=document.getElementById(id);
if(el){el.scrollIntoView({behavior:'smooth',block:'start'});if(window.innerWidth<=768)toggleSidebar()}
}

function toggleMenu(arrow){
const children=arrow.closest('.menu-parent').nextElementSibling;
if(children&&children.classList.contains('menu-children')){children.classList.toggle('open');arrow.classList.toggle('open')}
}

function toggleSubMenu(el){
const children=el.nextElementSibling;
if(children){children.classList.toggle('open');el.querySelector('.arrow').classList.toggle('open')}
}

function searchSections(q){
q=q.toLowerCase().trim();
document.querySelectorAll('.section').forEach(s=>{s.style.display=(!q||s.textContent.toLowerCase().includes(q))?'':'none'});
}

function handleUpload(input,key){
const files=input.files;if(!files.length)return;
Array.from(files).forEach((file,i)=>{
const reader=new FileReader();
reader.onload=function(e){
const d=getStore();if(!d[key])d[key]={media:[],note:''};
d[key].media.push({id:Date.now()+i,type:file.type.startsWith('video')?'video':'image',data:e.target.result,name:file.name});
setStore(d);renderGallery(key);
};
reader.readAsDataURL(file);
});
input.value='';
}

function removeMedia(key,mid){
if(!confirm(UI_STRINGS[currentLang].deleteConfirm))return;
const d=getStore();if(d[key])d[key].media=d[key].media.filter(m=>m.id!==mid);
setStore(d);renderGallery(key);
}

function renderGallery(key){
const g=document.getElementById('gal-'+key);if(!g)return;
const d=getStore();const items=(d[key]&&d[key].media)||[];
g.innerHTML=items.map(i=>`<div class="gallery-item"><button class="remove-gallery" onclick="removeMedia('${key}',${i.id})">✕</button>${i.type==='video'?`<video src="${i.data}" controls></video>`:`<img src="${i.data}" onclick="openLB(this.src)">`}<div class="caption">${i.name}</div></div>`).join('');
}

function saveNote(ta){
const key=ta.dataset.key;const d=getStore();
if(!d[key])d[key]={media:[],note:''};d[key].note=ta.value;setStore(d);
}

function collectAllIds(items){
let ids=[];
items.forEach(item=>{
ids.push(item.id);
if(item.children) item.children.forEach(ch=>{
ids.push(ch.id);
const nested=ch.subchildren||ch.subchildren2||[];
nested.forEach(sc=>{ids.push(sc.id);const n2=sc.subchildren2||[];n2.forEach(sc2=>ids.push(sc2.id))});
});
});
return ids;
}

function loadSaved(){
const d=getStore();
document.querySelectorAll('textarea.note-input').forEach(ta=>{const k=ta.dataset.key;if(d[k]&&d[k].note)ta.value=d[k].note});
collectAllIds(MENU_DATA).forEach(id=>renderGallery('s'+id));
}

function openLB(src){
const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:400;display:flex;align-items:center;justify-content:center;cursor:pointer';
o.onclick=()=>o.remove();const img=document.createElement('img');img.src=src;img.style.cssText='max-width:90%;max-height:90%;border-radius:8px';
o.appendChild(img);document.body.appendChild(o);
}

// Initialize with saved language
switchLang(currentLang);
</script>
</body>
</html>
