; Meow Live — workers/scheduler/stream-handler under supervisord (auto-restart on crash).
; Mirrors the proven manual runbook command set EXACTLY (queues: gifts,default,
; luckyGift / heavy1-3 / pk-job / rt_fanout_1-3 + stream consumer + scheduler).
; Octane is intentionally NOT managed here — it runs on :8099 already; managing
; it here would double-bind the port / risk the live app. Run inside meow-app via
;   supervisord -c /app/docker/meow-workers-supervisor.conf   (detached)
; and manage with
;   supervisorctl -c /app/docker/meow-workers-supervisor.conf status
[supervisord]
nodaemon=true
user=root
logfile=/app/storage/jobs-logs/meow-supervisord.log
pidfile=/tmp/meow-supervisord.pid

[unix_http_server]
file=/tmp/meow-supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/meow-supervisor.sock

; Primary: gift send + in-room frames (PushStreamDataJob on `default`) + lucky
; gift post-processing. 2 procs for gift-storm throughput. --max-jobs recycles
; the worker periodically so a leak never accumulates (supervisord respawns it).
[program:queue-primary]
command=php /app/artisan queue:work redis --queue=gifts,default,luckyGift --sleep=0 --tries=2 --max-jobs=1000
directory=/app
numprocs=2
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-primary.log
stdout_logfile_maxbytes=20MB

[program:queue-heavy]
command=php /app/artisan queue:work redis --queue=heavy1,heavy2,heavy3 --sleep=0 --tries=2 --max-jobs=1000
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-heavy.log
stdout_logfile_maxbytes=20MB

[program:queue-pk]
command=php /app/artisan queue:work redis --queue=pk-job --sleep=0 --tries=2 --max-jobs=1000
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-pk.log
stdout_logfile_maxbytes=20MB

[program:queue-rtfanout]
command=php /app/artisan queue:work redis --queue=rt_fanout_1,rt_fanout_2,rt_fanout_3 --sleep=0 --tries=2 --max-jobs=1000
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-rtfanout.log
stdout_logfile_maxbytes=20MB

[program:stream-handler]
command=php /app/artisan app:handling-room-stream-requests
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-stream.log
stdout_logfile_maxbytes=20MB

[program:scheduler]
command=php /app/artisan schedule:work
directory=/app
autostart=true
autorestart=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/app/storage/jobs-logs/sv-scheduler.log
stdout_logfile_maxbytes=20MB
