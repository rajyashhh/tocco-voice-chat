name: utd_live_room_kit
description: >
  UTD Live Room Kit — a LiveKit-based video live room (host camera + up to 3
  guest video tiles) built on the same seat state machine as
  utd_audio_room_kit. Provides camera tiles, invite/request-to-go-live,
  RTM messaging, minimize/PiP, and host force-control of guest media.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # LiveKit SDK — core audio/video engine
  livekit_client: ^2.7.0

  # WebRTC — direct access to Bluetooth-preferring audio routing
  flutter_webrtc: ^1.4.0

  # Android OS-level Picture-in-Picture (auto-enter on Home). Android-only;
  # every call is Platform.isAndroid-guarded. iOS / Android < 31 fall back to
  # the in-app minimize overlay.
  floating: ^6.0.0

  # State management
  flutter_bloc: ^9.1.1

  # Dependency injection
  get_it: ^9.2.0

  # Functional programming (Either type)
  dartz: ^0.10.1

  # Equality comparison
  equatable: ^2.0.8

  # Responsive UI
  flutter_screenutil: ^5.9.3

  # Audio session configuration (iOS critical)
  audio_session: ^0.1.21

  # Runtime permission requests (microphone + camera for live video tiles)
  permission_handler: ^12.0.1

  # HTTP client for UTD Stream API
  dio: ^5.4.0

  # Pretty Dio logger
  pretty_dio_logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
